name: Native Linux and macOS kits
on:
  workflow_dispatch:
  push:
    branches: [codex/native-kits]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_number }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
            native-${{ runner.os }}-${{ runner.arch }}-
      - name: Linux development and test libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxkbcommon-dev libwayland-dev libvulkan1 libegl1-mesa-dev gnome-keyring dbus-x11 xvfb
      - name: Check native GUI and agent
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Download verified backup engines
        run: python3 scripts/package-unix.py --tools-only
      - name: Native tests
        timeout-minutes: 15
        run: bash scripts/test-unix.sh
      - name: Build native package
        run: |
          cargo build --locked --release
          python3 scripts/package-unix.py
      - name: Install package and launch native GUI
        run: bash scripts/smoke-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: straja-${{ runner.os }}-${{ runner.arch }}
          path: dist/native/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_number }}
